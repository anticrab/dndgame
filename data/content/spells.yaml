# Каталог заклинаний (этап P1). Формат — см. YamlSpellRepository / docs/SPELLS.md.
# P1: только single-target / self. AoE и мультитаргет — этап P2.

- id: fire_bolt
  name: "Fire Bolt"
  level: 0
  school: evocation
  effect: attack
  targeting: { kind: single }
  range_ft: 120
  dice: "1d10"
  damage_type: fire
  description: "Заговор: метнуть огненную стрелу. Дальнобойная атака заклинанием; при попадании 1d10 огнём."

- id: sacred_flame
  name: "Sacred Flame"
  level: 0
  school: evocation
  effect: save
  targeting: { kind: single }
  range_ft: 60
  dice: "1d8"
  damage_type: radiant
  save_ability: DEX
  save_for_half: false
  description: "Заговор: сияющее пламя нисходит на цель. Спасбросок Ловкости; провал — 1d8 излучением, успех — без урона."

- id: magic_missile
  name: "Magic Missile"
  level: 1
  school: evocation
  effect: auto
  targeting: { kind: multi, max_targets: 3, allow_repeat_target: true }
  range_ft: 120
  dice: "1d4+1"
  damage_type: force
  description: "Три светящихся дротика бьют автоматически (без броска атаки). Каждый — 1d4+1 силового урона; дротики распределяются между целями (можно несколько в одну)."

- id: cure_wounds
  name: "Cure Wounds"
  level: 1
  school: abjuration
  effect: heal
  targeting: { kind: single }
  range_ft: 5
  heal_dice: "1d8"
  description: "Касанием восстановить существу 1d8 + модификатор заклинательной характеристики хитов."

- id: shield_of_faith
  name: "Shield of Faith"
  level: 1
  school: abjuration
  effect: buff
  targeting: { kind: single }
  range_ft: 60
  concentration: true
  buffs:
    - { target: armor_class, numeric_bonus: 2 }
  description: "Мерцающее поле даёт цели +2 к КД. Требует концентрации."

# --- AoE (этап P2) ---
- id: fireball
  name: "Fireball"
  level: 1
  school: evocation
  effect: save
  targeting: { kind: area, origin: at_point, shape: circle, radius_ft: 10 }
  range_ft: 150
  dice: "2d6"
  damage_type: fire
  save_ability: DEX
  save_for_half: true
  description: "Снаряд летит в выбранную точку (до 150 фт) и взрывается сферой радиусом 10 фт. Спасбросок Ловкости; провал — 2d6 огнём, успех — половина. Бьёт всех в зоне, включая союзников."

- id: burning_hands
  name: "Burning Hands"
  level: 1
  school: evocation
  effect: save
  targeting: { kind: area, origin: from_caster, shape: cone, length_ft: 15 }
  range_ft: 0
  dice: "2d6"
  damage_type: fire
  save_ability: DEX
  save_for_half: true
  description: "Конус пламени из ладоней (15 фт) в выбранном направлении. Спасбросок Ловкости; провал — 2d6 огнём, успех — половина."

- id: lightning_bolt
  name: "Lightning Bolt"
  level: 1
  school: evocation
  effect: save
  targeting: { kind: area, origin: from_caster, shape: line, length_ft: 30 }
  range_ft: 0
  dice: "2d6"
  damage_type: lightning
  save_ability: DEX
  save_for_half: true
  description: "Луч молнии (30 фт, ширина 1) в выбранном направлении. Спасбросок Ловкости; провал — 2d6 электричеством, успех — половина."

# --- мультитаргет-бафф (этап P2b) ---
- id: bless
  name: "Bless"
  level: 1
  school: enchantment
  effect: buff
  targeting: { kind: multi, max_targets: 3, allow_repeat_target: false }
  range_ft: 30
  concentration: true
  buffs:
    - { target: attack_roll, dice_bonus: "1d4" }
    - { target: saving_throw, dice_bonus: "1d4" }
  description: "Благословить до трёх существ: пока держится концентрация, каждое добавляет 1d4 к броскам атаки и спасброскам."
