  level: 1

# Этап D: «бывалый» воин для демо-сцены. Тот же воин L1, но со стартовым XP
# у порога 2 уровня (90 < 100, FastXpCurve) — как после пары стычек по канону
# SCENARIO_DEMO. В демо-бою первое же добивание гоблина (+25) перешагивает
# порог → level-up прямо в бою. Отдельный шаблон, чтобы не трогать сценарии,
# где воин стартует «с нуля».
- id: warrior_veteran
  name: Warrior (veteran)
  abilities:
    str: 16
    dex: 12
    con: 14
    int: 10
    wis: 10
    cha: 10
  max_hp: 20
  armor_class: 16
  speed_ft: 30
  proficiency_bonus: 2
  weapon_id: longsword
  default_faction: party
  character_class: fighter
  fighting_style: defense   # T4: выбор данными шаблона
  level: 1
  xp: 90
  # U5-3: демо-набор используемых предметов — зелье на «выжить» и свиток
  # как «джокер» против скопления. Загружаются builder'ом из items.yaml.
  starting_inventory:
    - healing_potion
    - scroll_of_fireball

- id: mage_apprentice
  name: Apprentice Mage
  abilities:
    str: 8
    dex: 12
    con: 12
    int: 16
    wis: 10
    cha: 10
  max_hp: 14
  armor_class: 12
  speed_ft: 30
  proficiency_bonus: 2
  weapon_id: longsword
  default_faction: party
  # T1: PC-волшебник 1-го уровня — класс/уровень для прогрессии и
  # профициентных спасбросков (INT, WIS). Ячейки берём из таблицы Волшебника
  # (L1 = две ячейки 1-го круга); fireball/lightning_bolt в known_spells —
  # «известны», но кастуются только начиная с 5-го уровня (ячейки 3-го круга).
  character_class: wizard
  level: 1
  # Заклинания: INT-кастер, заговоры безлимит. P2 — добавлены AoE.
  spellcasting_ability: INT
  known_spells: [fire_bolt, sacred_flame, magic_missile, cure_wounds, shield_of_faith, fireball, burning_hands, lightning_bolt, sleep, hold_person]
  spell_slots: { 1: 2 }
