# Сценарии MVP. Соответствует ScenarioTemplate.
#
# Карта читается как сетка символов; каждый символ → terrain id из
# легенды → канонический Terrain из domain/values/terrain.py.

- id: mvp_skirmish
  name: "MVP Skirmish"
  map:
    width: 5
    height: 5
    legend:
      ".": floor
      "#": wall
    grid:
      - "....."
      - "....."
      - "....."
      - "....."
      - "....."
  spawns:
    - template_id: warrior_lv1
      instance_id: aelar
      at: [2, 2]
      faction: party
    - template_id: goblin
      instance_id: goblin1
      at: [3, 2]
      faction: monsters

# Аудит 16 SC-R-NEW-001: до появления InteractAction/OpenDoorAction
# ставить closed_door в проходимом коридоре нельзя — сценарий иначе
# неразрешим (бой завершается только по MAX_ROUNDS=100, потому что
# монстр-AI не умеет открывать двери). В MVP коридор «всегда открыт»;
# closed_door вернётся вместе с InteractAction (см. ROADMAP §6).
- id: mvp_room
  name: "MVP Room with walls"
  map:
    width: 7
    height: 5
    legend:
      ".": floor
      "#": wall
    grid:
      - "#######"
      - "#.....#"
      - "#.....#"
      - "#.....#"
      - "#######"
  spawns:
    - template_id: warrior_lv1
      instance_id: aelar
      at: [1, 1]
      faction: party
    - template_id: goblin
      instance_id: goblin1
      at: [5, 3]
      faction: monsters

# K9 S1-1: сценарии для playtest-карт K8. Каждый ссылается на
# MapDocument из data/content/maps/<id>.yaml через поле `map_id`
# (новый путь scenario_builder). Inline `map` не задан — XOR-валидатор
# ScenarioTemplate проверит, что задан ровно один из двух.

