name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: mypy
        run: mypy src

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: pytest with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: Docs lint (basic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken intra-doc links
        run: |
          # Find markdown links of form (./X.md), (X.md), (../X.md), (ADR/X.md)
          # and assert each target exists. Soft-fail (warning) for now — strict
          # mode появится после стабилизации структуры docs/.
          set -e
          fail=0
          for f in docs/**/*.md docs/*.md; do
            [ -f "$f" ] || continue
            while read -r target; do
              [ -z "$target" ] && continue
              # strip anchor part (after #)
              target_path="${target%%#*}"
              [ -z "$target_path" ] && continue
              # resolve relative to file's directory
              dir=$(dirname "$f")
              if [ ! -e "$dir/$target_path" ] && [ ! -e "$target_path" ]; then
                echo "::warning file=$f::missing link target: $target"
                fail=$((fail+1))
              fi
            done < <(grep -oE '\]\(([^)]+\.md)[^)]*\)' "$f" | sed -E 's/^\]\(//; s/\)$//' || true)
          done
          echo "Total potentially broken links: $fail"
